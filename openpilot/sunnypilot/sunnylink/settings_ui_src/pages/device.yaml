# Page: device
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: device
label: Device
icon: device
order: 6
remote_configurable: true
description: Device behavior, units, and recording settings
sections:
- id: general
  title: General
  description: Power, boot, and unit preferences
  items:
  - key: OffroadMode
    widget: toggle
    title: Force Offroad Mode
  - key: DeviceBootMode
    widget: option
    title: Wake Up Behavior
    description: 'Controls state of the device after boot/sleep. Default: Device will boot/wake-up normally and will be ready
      to engage. Offroad: Device will be in Always Offroad mode after boot/wake-up.'
    options:
    - value: 0
      label: Standard
    - value: 1
      label: Always Offroad
  - key: QuietMode
    widget: toggle
    title: Quiet Mode
  - key: OnroadUploads
    widget: toggle
    title: Onroad Uploads
  - key: MaxTimeOffroad
    widget: option
    title: Max Time Offroad
    description: Device will automatically shutdown after set time once the engine is turned off. 30h is the default.
    options:
    - value: 0
      label: Always On
    - value: 5
      label: 5m
    - value: 10
      label: 10m
    - value: 15
      label: 15m
    - value: 30
      label: 30m
    - value: 60
      label: 1h
    - value: 120
      label: 2h
    - value: 180
      label: 3h
    - value: 300
      label: 5h
    - value: 600
      label: 10h
    - value: 1440
      label: 24h
    - value: 1800
      label: 30h (Default)
- id: language
  title: Language
  items:
  - key: LanguageSetting
    widget: info
    title: Language

- id: dropbox_archive
  title: Dropbox Backup
  description: Link Dropbox on the comma under Software. Backups are independent of comma and Sunnylink uploads. Local recordings may expire before backup if storage fills.
  items:
  - key: ArchiveEnabled
    widget: toggle
    title: Enable Dropbox Backup
  - key: ArchiveNetwork
    widget: option
    title: Upload Network
    options:
    - value: 0
      label: Unmetered Wi-Fi Only
    - value: 1
      label: Any Unmetered Connection
    - value: 2
      label: Allow Metered Connections
  - key: ArchiveOnroad
    widget: toggle
    title: Upload While Driving
    description: Off by default. Enabling may use network and device resources during a drive.
  - key: ArchiveLogs
    widget: toggle
    title: Back Up Full and Quick Logs
  - key: ArchiveRoad
    widget: toggle
    title: Back Up Road Camera Videos
  - key: ArchivePreview
    widget: toggle
    title: Back Up Low Resolution Video
  - key: ArchiveCabin
    widget: toggle
    title: Back Up Recorded Cabin Video
    description: Only uploads cabin video that was already recorded. Does not enable cabin recording.
  - key: ArchiveStatus
    widget: info
    title: Dropbox Backup Status
